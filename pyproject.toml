[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kad-arbitr-monitor"
version = "0.1.0"
description = "Telegram MVP scaffold for arbitration case monitoring by INN"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "celery[redis]>=5.4,<6",
  "redis>=6.1,<7",
  "pydantic-settings>=2.5,<3",
  "structlog>=24,<26",
  "packaging>=23,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
