services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kad
      POSTGRES_USER: kad
      POSTGRES_PASSWORD: kad_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kad -d kad"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    env_file: .env
    command: python -m app.bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    command: celery -A app.celery_app worker -l INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    env_file: .env
    command: celery -A app.celery_app beat -l INFO
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
